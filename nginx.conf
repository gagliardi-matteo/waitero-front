# Request URLs can contain QR/SSE credentials. Never log URI, query, cookies or headers.
log_format waitero_safe '$remote_addr $request_method $status $request_time';
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log waitero_safe;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
